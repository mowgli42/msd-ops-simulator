# Live site fleet on one shared cabinet — 8 platforms, 1 usable slot.
# Same cabinet physics as shared-cabinet.yaml; scaled to the current fleet size.
# Demo factory remains fixtures/baseline.yaml (independent 2L/3O stations).

scenario_id: site-eight

timing:
  ticks_per_hour: 20
  operating_hours_per_day: 24

operations:
  vehicles: 8
  missions_per_vehicle_per_day: 3.0
  ports_per_vehicle: 1
  device_pool: 8
  shared_station: true
  cabinet_slots: 2
  slots_in_use: 1
  loading_stations: 1
  offload_stations: 1

durations_hours:
  mission: 2.0
  load: 0.5
  offload: 0.5

modes:
  high_data_volume: false
  offload_factor: 0.9

arrival:
  mode: smooth
  # mode: shift
  preload_window_hours: 2
  offload_window_hours: 2

analysis:
  utilization_target: 0.85
  device_buffer_fraction: 0.10
