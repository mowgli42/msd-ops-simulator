# Topology 2-3-2 = platforms-stations-devices
# 2 platforms, 3 shared usable slots, 2 devices.
# Small multi-platform cell: stations can outrun or lag platforms.

scenario_id: topology-2-3-2
topology_code: "2-3-2"

timing:
  ticks_per_hour: 20
  operating_hours_per_day: 24

operations:
  vehicles: 2
  missions_per_vehicle_per_day: 3.0
  ports_per_vehicle: 1
  device_pool: 2
  shared_station: true
  cabinet_slots: 3
  slots_in_use: 3
  loading_stations: 3
  offload_stations: 3

durations_hours:
  mission: 2.0
  load: 0.5
  offload: 0.5

modes:
  high_data_volume: false
  offload_factor: 0.9

arrival:
  mode: smooth
  # mode: shift
  preload_window_hours: 2
  offload_window_hours: 2

analysis:
  utilization_target: 0.85
  device_buffer_fraction: 0.10
